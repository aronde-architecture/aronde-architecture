<script>
(function () {
  /* Dans le SVG, le dessin du mot ARONDE occupe 1087/1160 de la largeur
     du fichier : on vise donc sa largeur VISUELLE, pas la boîte de l'image. */
  const ARONDE_INK_RATIO = 1087 / 1160;

  function fitFontSize(el, targetWidth, minPx, maxPx) {
    if (!el || targetWidth <= 0) return;

    let lo = minPx;
    let hi = maxPx;

    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      el.style.fontSize = mid + "px";
      const width = el.getBoundingClientRect().width;

      if (width < targetWidth) lo = mid;
      else hi = mid;
    }

    el.style.fontSize = ((lo + hi) / 2).toFixed(3) + "px";
  }

  function adjustPortraitType() {
    const isPortrait =
      window.matchMedia("(orientation: portrait) and (max-width: 700px)").matches;

    const service = document.querySelector(".services > span");
    const wordmark = document.querySelector(".wordmark");
    const name = document.querySelector(".professional strong");
    const registration = document.querySelector(".professional > span");

    /* Important à la rotation : aucune taille inline ne doit polluer le paysage. */
    if (!isPortrait) {
      if (service) service.style.removeProperty("font-size");
      if (registration) registration.style.removeProperty("font-size");
      return;
    }

    if (service && wordmark) {
      const targetWidth =
        wordmark.getBoundingClientRect().width * ARONDE_INK_RATIO;
      fitFontSize(service, targetWidth, 8.6, 11.4);
    }

    if (name && registration) {
      const targetWidth = name.getBoundingClientRect().width;
      fitFontSize(registration, targetWidth, 6.4, 9.2);
    }
  }

  const run = () =>
    requestAnimationFrame(() =>
      requestAnimationFrame(adjustPortraitType)
    );

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(run);
  }

  window.addEventListener("load", run, { once: true });
  window.addEventListener("resize", run);
  window.addEventListener("orientationchange", run);
})();
</script>
